name: Update player lists

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 1 * *"

permissions:
  contents: write

jobs:
  update-lists:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Refresh Romanian player list
        run: python -m mws_monitor update-romanian-players --source data/romanian_players.csv --output data/romanian_players.csv --delay 1

      - name: Refresh Top 200 U23 player list
        run: python -m mws_monitor update-u23-players --output data/top_200_u23_players.csv --limit 200 --delay 1

      - name: Run Romanian auction check
        run: python -m mws_monitor romanian-auctions --players data/romanian_players.csv --output-dir outputs

      - name: Run Top 200 U23 auction check
        run: python -m mws_monitor u23-auctions --players data/top_200_u23_players.csv --output-dir outputs/u23

      - name: Upload refreshed data
        uses: actions/upload-artifact@v4
        with:
          name: mws-player-lists-and-auctions
          path: |
            data/romanian_players.csv
            data/top_200_u23_players.csv
            outputs/latest.*
            outputs/u23/latest.*

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/romanian_players.csv data/top_200_u23_players.csv outputs/latest.csv outputs/latest.json outputs/latest.md outputs/u23/latest.csv outputs/u23/latest.json outputs/u23/latest.md
          git diff --cached --quiet || git commit -m "Refresh tracked player lists and MWS outputs"
          git push
