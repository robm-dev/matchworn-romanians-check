name: MatchWornShirt Romanian auctions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 */3 * *"

permissions:
  contents: write

jobs:
  check-auctions:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Romanian auction check
        run: python -m mws_monitor romanian-auctions --players data/romanian_players.csv --output-dir outputs

      - name: Upload latest outputs
        uses: actions/upload-artifact@v4
        with:
          name: mws-romanian-auctions
          path: outputs/latest.*

      - name: Commit latest outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/latest.csv outputs/latest.json outputs/latest.md
          git diff --cached --quiet || git commit -m "Update Romanian MWS auction results"
          git push
